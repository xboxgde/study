<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피 소개 페이지</title>
</head>
<body>
    <h1>커피 종류를 소개합니다.</h1>
    <p>아메리카노, 카페라떼, 카푸치노, 카라멜마끼아또를 소개합니다.</p>

    <table>
        <tr> <!-- 1행 -->
            <th>커피 이름</th> <!-- 1열 -->
            <th>커피 설명</th> <!-- 2열 -->
            <th>커피 이미지</th> <!-- 3열 -->
        </tr>

        <tr> <!-- 2행 -->
            <td>아메리카노</td>
            <td>아메리카노 설명중입니다.</td>
            <td><img src="img1.jpg" height="100"></td>
        </tr>

        <tr> <!-- 3행 -->
            <td>카페라떼</td>
            <td>카페라떼 설명중입니다.</td>
            <td><img src="img2.jpg" height="100"></td>
        </tr>



    </table>

    <hr>

    <table>
        <tr>
            <td><img src="img1.jpg" width="100" height="100"></td>
            <td><img src="img2.jpg" width="100" height="100"></td>
            <td><img src="img3.jpg" width="100" height="100"></td>
            <td><img src="img4.jpg" width="100" height="100"></td>
        </tr>
    </table>

</html>
