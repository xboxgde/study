<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <!-- 내부 스타일 적용 -->

        *
        {
            margin: 0; /* 바깥 여백 설정 */
            padding: 0; /* 안쪽 여백 설정 */
        }

        div 
        {
            background-color: pink;
            color: green;
            text-align: center;
            padding: 20px;
            
        }

        img

            border: 3px dotted   black;
            border-radius: 50%; /*시계방향 왼쪽위 ~> 왼쪽아래 */
        }

     </style>

<body>
    <div> <!-- 영역 태그 -->
