    <h1>에스프레소</h1>

    <p>
        에스프레소(espresso)는 곱게 간 원두에 고온, <mark>고압으로 소량의 물을 투과시켜 추출한 커피</mark>이다. 
        주로 데미타스 컵에 담는다.
        반대로 물을 투과시키는 게 아니라 깔때기에 걸러서 추출하면 드립 커피가 된다.
        물을 더 넣으면 아메리카노, 우유를 넣으면 카페라테가 된다.   
    </p>
