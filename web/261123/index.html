<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>css 활용</title>
</head>
<body>
    <div id="ani">
        <h2 id="ti">css3를 이용한 간단한 애니메이션</h2>
        <p>
            <strong>css3</strong>를 이용해서 애니메이션을 만들기 위해서는
            애니메이션 스타일과 애니메이션 중간 상태를 나타내는 <i>keyframe</i>이 필요합니다.
        </p>
        <h3>@keyframe...</h3>
        <h2>Transform</h2>
        <img src="images/img1.jpg" width="170" height="170">
        <img id="transform1" src="images/img1.jpg" width="170" height="170">
        <img id="transform2" src="images/img1.jpg" width="170" height="170">
        <img id="transform3" src="images/img1.jpg" width="170" height="170">

        <h2>transition</h2>
        <p><strong>transition</strong>은 애니메이션 효과를 만드는데 사용할 수 있습니다.
        transition을 사용하지 않을 경우에는 변화가 순간적으로 일어나지만, 속도를 지정하면
        사용자에게 부드러운 화면을 보여줄 수 있습니다.
        </p>

        <div id="box"></div>

        <div id="box2"></div>
    </div>

    <div id="map">
        <h2>맵 태그 사용</h2>
        <img src="images/img2.jpg" usemap="#maps">
        <map name="maps">
            <area shape="rect" coords="0,0,180,297" href="https://namu.wiki/w/HTML5"> 
            <area shape="circle" coords="290,127,110" href="https://namu.wiki/w/CSS"> 
            <area shape="poly" coords="425,48,578,48,570,210,504,227,438,210,425,48" href="https://namu.wiki/w/JS"> 

        </map>
    </div>

</body>
</html>
